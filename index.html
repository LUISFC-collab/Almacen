<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F3864">
<title>Almacén — Consorcio CPQ · Mina Columbito</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="estilos.css">
<script src="config.js"></script>
</head>
<body>

<!-- =====================================================================
     La app entra por acá y la dirección se queda en /Almacen/ — sin nada
     colgando al final.

     Antes esto mandaba a computadora.html o a celular.html y la dirección
     quedaba con el .html a la vista. Ahora no se va a ningún lado: se
     carga el motor, se mira con qué equipo se entró, y se trae SOLO el
     archivo de ese equipo.

     Los dos archivos de equipo siguen separados, que era lo importante:
     se toca el diseño de computadora sin rozar el del celular.
     ===================================================================== -->

<!-- Las pantallas y los modales, iguales en los dos equipos -->
<script src="pantallas.js"></script>

<!-- El motor: toda la lógica. Se arregla una vez y sirve para los dos -->
<script src="app.js"></script>

<!-- Conversor de HEIC (las fotos del iPhone). Va antes de fotos.js -->
<script src="heic2any.min.js"></script>
<script src="fotos.js"></script>

<!-- La sincronización entre equipos -->
<script src="sync.js"></script>

<script>
/* =====================================================================
   Qué equipo es, y qué archivo se trae

   No se mira el "user agent": esa cadena miente —Chrome dice ser Safari,
   el iPad dice ser Mac— y cada modelo nuevo que sale rompe la lista. Se
   mira si hay mouse, si la pantalla se toca y cuánto mide la ventana,
   que es lo único que de verdad distingue una laptop de un teléfono.

   Para probar la otra vista sin cambiar de equipo:
     ?equipo=computadora   ·   ?equipo=celular
   ===================================================================== */
(function traerElDeEsteEquipo(){
  var pedido = (location.search.match(/[?&]equipo=(computadora|celular|tablet)/) || [])[1];

  var mq = function(q){ return window.matchMedia && window.matchMedia(q).matches; };
  var hayMouse = mq("(any-pointer: fine)") || mq("(any-hover: hover)");
  var ancho = window.innerWidth || document.documentElement.clientWidth;
  var equipo = pedido || ((ancho >= 980 && hayMouse) ? "computadora" : "celular");

  /* La tablet con teclado se trabaja como computadora; sin él, como
     teléfono. Es lo que hace la persona con ella, no lo que dice ser. */
  var archivo = (equipo === "computadora") ? "computadora.js" : "celular.js";

  document.body.setAttribute("data-equipo", equipo);

  var s = document.createElement("script");
  s.src = archivo;
  s.async = false;          /* que corra después del motor, no antes */
  document.body.appendChild(s);

  /* =====================================================================
     Guarda la app en el equipo para que abra sin señal — y se actualiza
     sola cuando hay una versión nueva.

     Sin esto, el que ya tenía la app abierta seguía viendo la de ayer
     hasta cerrarla del todo: el service worker sirve lo que guardó, y en
     un celular la app casi nunca se cierra de verdad. En obra eso
     significa que la mitad del equipo trabaja con una versión y la otra
     mitad con otra, sin que nadie se entere.

     Ahora, cuando el navegador detecta una versión nueva y ya había una
     andando, la página se recarga sola UNA vez. Se hace en cuanto el
     trabajador nuevo toma el control, no antes, para no recargar sobre
     una versión a medio instalar.
     ===================================================================== */
  if("serviceWorker" in navigator){
    var yaRecargo = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(yaRecargo) return;
      yaRecargo = true;
      location.reload();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        /* Se pregunta cada media hora: la app se deja abierta todo el
           día y si no, no se entera de nada hasta el otro día. */
        setInterval(function(){ reg.update().catch(function(){}); }, 1800000);
      }).catch(function(){});
    });
  }
})();
</script>
</body>
</html>
