<body>
<!-- =====================================================================
     Este archivo ya no es la app: es el que reparte.

     Mira con qué equipo se entra y manda a la pantalla que corresponde.
     No mira el "user agent" —esa cadena miente y cada modelo nuevo rompe
     la lista— sino si hay mouse, si la pantalla se toca y cuánto mide la
     ventana, que es lo único que importa de verdad.

     Quien quiera entrar a una a propósito puede ir directo:
       computadora.html   ·   celular.html
     ===================================================================== -->
<script>
(function repartir(){
  var mq = function(q){ return window.matchMedia && window.matchMedia(q).matches; };
  var hayMouse = mq("(any-pointer: fine)") || mq("(any-hover: hover)");
  var ancho = window.innerWidth || document.documentElement.clientWidth;
  var destino = (ancho >= 980 && hayMouse) ? "computadora.html" : "celular.html";

  /* replace y no href: así el botón "atrás" del navegador no devuelve
     a esta página en blanco una y otra vez. */
  location.replace(destino + location.search + location.hash);
})();
</script>
<noscript>
  <p style="font:16px system-ui;padding:24px">
    Esta aplicación necesita JavaScript.
    <a href="computadora.html">Abrir la versión de computadora</a> ·
    <a href="celular.html">Abrir la versión de celular</a>
  </p>
</noscript>
</body>
</html>
