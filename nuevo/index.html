<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Almacén CPQ · Columbito</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4B8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almacén CPQ">

<!-- El ?v= de cada archivo no es adorno: sin él el navegador se queda con
     la copia que bajó la primera vez y sigue mostrando la app de la semana
     pasada aunque el servidor ya tenga la nueva. Al cambiar el número,
     la dirección cambia y el navegador está obligado a bajarla otra vez.
     La versión pegada a cada archivo es la misma que se ve arriba del
     botón de salir: si no coinciden, ese equipo está atrasado. -->
<link rel="stylesheet" href="estilos/1-base.css?v=2026-09-02-l">
<link rel="stylesheet" href="estilos/2-panel-izquierdo.css?v=2026-09-02-l">
<link rel="stylesheet" href="estilos/3-componentes.css?v=2026-09-02-l">
</head>
<body>

<div class="marco">
  <nav class="riel">
    <div class="marca"><b>Almacén CPQ</b><small>Mina Columbito</small></div>
    <div id="quien"></div>
    <div id="sombreros" style="display:none">
      <button type="button" data-sombrero="almacenero">Almacén</button>
      <button type="button" data-sombrero="admin">Administrar</button>
    </div>
    <p class="rotulo">Trabajo del día</p>
    <div class="lista" id="menu"></div>
    <div id="salir"><button type="button">Salir</button></div>
  </nav>

  <main class="lienzo">
    <div id="banda"><span id="banda-txt"></span><button type="button" id="banda-volver">Volver a mi panel</button></div>
    <div class="barra"><h1 id="titulo"></h1></div>
    <div class="zona" id="zona"></div>
  </main>
</div>

<div id="portada">
  <div class="centro">
    <h1>Almacén CPQ · Columbito</h1>
    <p class="sub">Entre con su fotocheck. Verá solo lo que le toca.</p>

    <div class="acceso">
      <div class="rejilla dos">
        <label class="campo"><span>N° de fotocheck</span>
          <input type="tel" inputmode="numeric" id="ac-fc" placeholder="48219"></label>
        <label class="campo"><span>Contraseña</span>
          <input type="password" id="ac-clave" placeholder="La suya"></label>
      </div>
      <p class="err" id="ac-err"></p>
      <div class="botones">
        <button class="bt pri" type="button" id="ac-entrar">Entrar</button>
        <button class="bt" type="button" id="ac-crear">Crear mi perfil</button>
      </div>
    </div>

    <div id="alta" style="display:none">
      <div class="acceso">
        <h3>Crear mi perfil</h3>
        <div class="rejilla dos">
          <label class="campo"><span>Nombre completo</span><input id="al-nombre" placeholder="Nombres y apellidos"></label>
          <label class="campo"><span>Puesto</span><select id="al-puesto"></select></label>
          <label class="campo"><span>Celular</span><input type="tel" inputmode="numeric" id="al-cel" placeholder="999 999 999"></label>
          <label class="campo"><span>N° de fotocheck</span><input type="tel" inputmode="numeric" id="al-fc" placeholder="48219"></label>
          <label class="campo"><span>Contraseña</span><input type="password" id="al-clave" placeholder="La que usted quiera"></label>
        </div>
        <p class="err" id="al-err"></p>
        <div class="botones">
          <button class="bt pri" type="button" id="al-ok">Crear y entrar</button>
          <button class="bt" type="button" id="al-cancelar">Cancelar</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="aviso-flotante" role="status" aria-live="polite"></div>

<script src="scripts/0-nube.js?v=2026-09-02-l"></script>
<script src="scripts/1-nucleo.js?v=2026-09-02-l"></script>
<script src="scripts/2-pantallas.js?v=2026-09-02-l"></script>
</body>
</html>
