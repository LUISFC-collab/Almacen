<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F3864">
<title>Almacen — Consorcio CPQ · Mina Columbito</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="estilos.css">
<script src="config.js"></script>
</head>
<body data-equipo="computadora">

<!-- PANTALLA DE COMPUTADORA. Lo propio de este equipo vive en computadora.js. -->

<!-- Las pantallas y los modales, iguales en los dos equipos -->
<script src="pantallas.js"></script>

<!-- El motor: toda la logica. Se arregla una vez y sirve para los dos -->
<script src="app.js"></script>

<!-- Conversor de HEIC (las fotos del iPhone). Va antes de fotos.js -->
<script src="heic2any.min.js"></script>
<script src="fotos.js"></script>

<!-- La sincronizacion entre equipos -->
<script src="sync.js"></script>

<!-- LO PROPIO DE ESTE EQUIPO. Se toca sin rozar el otro. -->
<script src="computadora.js"></script>

<script>
/* Guarda la app en el equipo para que abra sin senal. */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
